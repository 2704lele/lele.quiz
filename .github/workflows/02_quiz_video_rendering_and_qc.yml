name: "02 - Quiz Video Rendering & Auto-QC (Gatekeeper 2 QC)"

on:
  schedule:
    - cron: '30 18,22,2,6,10,14 * * *'
  workflow_dispatch:
    inputs:
      tab:
        description: "Target Quiz Tab"
        required: true
        default: "all"
        type: choice
        options:
          - "all"
          - "pinyin"
          - "vocabCN"
          - "vocabVN"
          - "multilevels"
      mode:
        description: "Execution Mode"
        required: true
        default: "all_pending"
        type: choice
        options:
          - "all_pending"
          - "specific_row"
      row_id:
        description: "Specific Row ID (if specific_row selected)"
        required: false
        default: ""
      quality:
        description: "Video Render Quality"
        required: true
        default: "qh"
        type: choice
        options:
          - "qh"
          - "ql"
  repository_dispatch:
    types: [quiz_rendering]

permissions:
  contents: read

jobs:
  render:
    name: "Manim 1080x1920 60fps Render & GK2 QC"
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Install System Dependencies (FFmpeg, Pango, Cairo, CJK Fonts)"
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev pkg-config fonts-noto-cjk fonts-noto-color-emoji

      - name: "Set up Python 3.10"
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: "Install Python Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install manim edge-tts gspread google-api-python-client google-auth google-auth-oauthlib pypinyin requests

      - name: "Configure Zero-Leak Vault Credentials"
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          GOOGLE_OAUTH_JSON: ${{ secrets.GOOGLE_USER_OAUTH2_JSON }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p ~/.cloud-profiles/lelehoctiengtrung/google_sa
          mkdir -p ~/.cloud-profiles/lelehoctiengtrung/google_oauth
          mkdir -p ~/.cloud-profiles/lelehoctiengtrung/telegram

          if [ -n "$GCP_SA_KEY" ]; then
            printf '%s\n' "$GCP_SA_KEY" > ~/.cloud-profiles/lelehoctiengtrung/google_sa/service_account.json
            chmod 600 ~/.cloud-profiles/lelehoctiengtrung/google_sa/service_account.json
          fi

          if [ -n "$GOOGLE_OAUTH_JSON" ]; then
            printf '%s\n' "$GOOGLE_OAUTH_JSON" > ~/.cloud-profiles/lelehoctiengtrung/google_oauth/user_oauth2.json
            chmod 600 ~/.cloud-profiles/lelehoctiengtrung/google_oauth/user_oauth2.json
          fi

          if [ -n "$TELEGRAM_TOKEN" ]; then
            echo "TELEGRAM_BOT_TOKEN=$TELEGRAM_TOKEN" > ~/.cloud-profiles/lelehoctiengtrung/telegram/telegram.env
            echo "TELEGRAM_CHAT_ID=${TELEGRAM_CHAT:--1004392602002}" >> ~/.cloud-profiles/lelehoctiengtrung/telegram/telegram.env
            chmod 600 ~/.cloud-profiles/lelehoctiengtrung/telegram/telegram.env
          fi

      - name: "Execute Video Rendering & Gatekeeper 2 QC"
        env:
          TARGET_TAB: ${{ github.event.inputs.tab || github.event.client_payload.tab || 'all' }}
          ROW_ID: ${{ github.event.inputs.row_id || github.event.client_payload.row_id || '' }}
          QUALITY: ${{ github.event.inputs.quality || github.event.client_payload.quality || 'qh' }}
        run: |
          echo "🚀 Starting Video Render: Tab=$TARGET_TAB, Row=$ROW_ID, Quality=$QUALITY"
          python3 scripts/run_render_dispatcher.py --tab "$TARGET_TAB" --row "$ROW_ID" --quality "$QUALITY"

      - name: "Enforce 21px Row Height Invariant"
        if: always()
        run: |
          python3 scripts/enforce_row_height_21px.py

      - name: "Notify Completion to Telegram"
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '-1004392602002' }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            STATUS="${{ job.status }}"
            MSG="🎬 <b>[GHA Video Render Complete]</b>%0AStatus: <b>$STATUS</b>%0ATab: <code>${{ github.event.inputs.tab || 'all' }}</code>%0AAll processed videos uploaded to Google Drive with <b>Ready</b> status (21px locked)."
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}&text=${MSG}&parse_mode=HTML" > /dev/null || true
          fi
