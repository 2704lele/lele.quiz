version: '3.8'

services:
  quiz-runner:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    tmpfs:
      - /dev/shm:rw,noexec,nosuid,size=256m
    volumes:
      - ..:/workspace:cached
      - ~/.cloud-profiles/lelehoctiengtrung:/workspace/.secrets:ro
    environment:
      - PYTHONUNBUFFERED=1
      - GOOGLE_APPLICATION_CREDENTIALS=/workspace/.secrets/google_sa/service_account.json
    working_dir: /workspace
    stdin_open: true
    tty: true
